name: Atrium
options:
  bundleIdPrefix: com.atrium
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: "1.5.0"

targets:
  Atrium:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: Inject
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Atrium
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - EBGaramond-Regular.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-MediumItalic.ttf
        NSLocalNetworkUsageDescription: "Atrium uses local network to receive hot-reload updates from InjectionIII during development."
        NSBonjourServices:
          - _injection._tcp
          - _injectionMacOSX._tcp
          - _injectionTVOS._tcp
          - _injection2._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ritwikdeshpande.atrium
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "443MNYHZG2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited) -Xlinker -interposable"
