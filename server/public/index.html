<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Objects</title>
<style>
  /* Just the names of the things, each on its own line, large enough to see.
     Nothing else on the page yet; it grows as the work does. */
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/BricolageGrotesque_400Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #0e0d0c;
    --ink: #f2eee6;
    --faint: #56504a;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    padding-block: max(12vh, env(safe-area-inset-top)) 20vh;
    padding-inline: max(7vw, 20px);
    box-sizing: border-box;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    font-size: clamp(30px, 6.4vw, 72px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    padding-block: 0.08em;
    overflow-wrap: anywhere;
  }
  #empty { color: var(--faint); font-size: clamp(22px, 3vw, 30px); }
</style>
</head>
<body>
<ol id="names"></ol>
<p id="empty" hidden>Nothing named yet.</p>
<script>
  // Reads the names straight from the Mac's sync server and keeps watching, so a
  // thing named on the phone appears here a few seconds later. Each check only
  // touches what changed: a new name is added once at the bottom, a removed one
  // folds away, a renamed one changes in place. An unchanged list leaves the
  // page alone.
  const list = document.getElementById("names");
  const empty = document.getElementById("empty");
  const shown = new Map(); // id -> <li>
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const EASE = "cubic-bezier(.25,.8,.3,1)";
  let last = null;
  let loaded = false;

  function arrive(li) {
    if (still.matches) return;
    li.animate(
      [{ opacity: 0, transform: "translateY(0.3em)" }, { opacity: 1, transform: "none" }],
      { duration: 700, easing: EASE },
    );
  }

  function leave(li) {
    if (still.matches) return li.remove();
    const h = li.offsetHeight;
    li.style.overflow = "hidden";
    li.animate(
      [{ opacity: 1, height: h + "px" }, { opacity: 0, height: "0px", paddingBlock: "0px" }],
      { duration: 420, easing: EASE },
    ).finished.then(() => li.remove(), () => li.remove());
  }

  function nearBottom() {
    return innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  }

  async function refresh() {
    let body;
    try {
      body = await (await fetch("/api/objects", { cache: "no-store" })).text();
    } catch {
      return; // server restarting; try again on the next tick
    }
    if (body === last) return;
    last = body;
    const objects = JSON.parse(body);
    const follow = loaded && nearBottom();

    const ids = new Set(objects.map((o) => o.id));
    for (const [id, li] of shown) {
      if (!ids.has(id)) {
        shown.delete(id);
        leave(li);
      }
    }

    let prev = null;
    let added = null;
    for (const o of objects) {
      let li = shown.get(o.id);
      if (!li) {
        li = document.createElement("li");
        li.textContent = o.text;
        shown.set(o.id, li);
        prev ? prev.after(li) : list.prepend(li);
        if (loaded) {
          arrive(li);
          added = li;
        }
      } else {
        if (li.textContent !== o.text) li.textContent = o.text;
        const inPlace = prev ? prev.nextElementSibling === li : list.firstElementChild === li;
        if (!inPlace) prev ? prev.after(li) : list.prepend(li);
      }
      prev = li;
    }

    // If you were already at the bottom, glide down to what just arrived.
    if (added && follow) added.scrollIntoView({ behavior: still.matches ? "auto" : "smooth", block: "end" });
    empty.hidden = objects.length > 0;
    loaded = true;
  }

  refresh();
  setInterval(() => document.hidden || refresh(), 4000);
  document.addEventListener("visibilitychange", () => document.hidden || refresh());
</script>
</body>
</html>
