<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Objects</title>
<style>
  /* The names of the things, each on its own line, large enough to see,
     gathered under the categories they've been sorted into. The page grows
     as the work does. */
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/BricolageGrotesque_400Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #0e0d0c;
    --ink: #f2eee6;
    --faint: #56504a;
    --quiet: #a39a90;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    padding-block: max(8vh, env(safe-area-inset-top)) 12vh;
    padding-inline: max(5vw, 20px);
    box-sizing: border-box;
  }
  /* Small enough to take in at once: the categories flow into as many
     columns as fit, each kept whole. */
  main { column-width: 250px; column-gap: clamp(28px, 4vw, 56px); }
  section { break-inside: avoid; padding-bottom: clamp(28px, 4vh, 44px); }
  h2 {
    margin: 0 0 8px;
    color: var(--quiet);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  h2 .n { color: var(--faint); margin-left: 0.5em; font-variant-numeric: tabular-nums; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    font-size: 17px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    padding-block: 0.06em;
    overflow-wrap: anywhere;
  }
  #empty { color: var(--faint); font-size: 17px; }
</style>
</head>
<body>
<main id="groups"></main>
<p id="empty" hidden>Nothing named yet.</p>
<script>
  // Reads the names straight from the Mac's sync server and keeps watching, so a
  // thing named on the phone appears here a few seconds later. Each check only
  // touches what changed: a new name is added once in its place, a removed one
  // folds away, a renamed or re-sorted one changes in place. An unchanged list
  // leaves the page alone. Names without a category gather at the end.
  const groups = document.getElementById("groups");
  const empty = document.getElementById("empty");
  const shown = new Map(); // id -> <li>
  const sections = new Map(); // category key -> { sec, ol, n }
  const UNSORTED = { key: "", title: "Not sorted yet" };
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const EASE = "cubic-bezier(.25,.8,.3,1)";
  let last = null;
  let loaded = false;

  function arrive(li) {
    if (still.matches) return;
    li.animate(
      [{ opacity: 0, transform: "translateY(0.3em)" }, { opacity: 1, transform: "none" }],
      { duration: 700, easing: EASE },
    );
  }

  function leave(li) {
    if (still.matches) return li.remove();
    const h = li.offsetHeight;
    li.style.overflow = "hidden";
    li.animate(
      [{ opacity: 1, height: h + "px" }, { opacity: 0, height: "0px", paddingBlock: "0px" }],
      { duration: 420, easing: EASE },
    ).finished.then(() => li.remove(), () => li.remove());
  }

  function section(cat) {
    let s = sections.get(cat.key);
    if (!s) {
      const sec = document.createElement("section");
      const h = document.createElement("h2");
      const title = document.createElement("span");
      const n = document.createElement("span");
      n.className = "n";
      h.append(title, n);
      const ol = document.createElement("ol");
      sec.append(h, ol);
      s = { sec, ol, title, n };
      sections.set(cat.key, s);
    }
    if (s.title.textContent !== cat.title) s.title.textContent = cat.title;
    return s;
  }

  function nearBottom() {
    return innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  }

  async function refresh() {
    let body;
    try {
      body = await (await fetch("/api/objects", { cache: "no-store" })).text();
    } catch {
      return; // server restarting; try again on the next tick
    }
    if (body === last) return;
    last = body;
    const { categories, objects } = JSON.parse(body);
    const follow = loaded && nearBottom();

    const ids = new Set(objects.map((o) => o.id));
    for (const [id, li] of shown) {
      if (!ids.has(id)) {
        shown.delete(id);
        leave(li);
      }
    }

    const known = new Set(categories.map((c) => c.key));
    const order = [...categories, UNSORTED];
    const byKey = new Map(order.map((c) => [c.key, []]));
    for (const o of objects) byKey.get(known.has(o.category) ? o.category : "").push(o);

    let prevSec = null;
    let added = null;
    for (const cat of order) {
      const items = byKey.get(cat.key);
      const s = section(cat);
      if (!items.length) {
        s.sec.remove();
        continue;
      }
      s.n.textContent = items.length;
      const secInPlace = prevSec ? prevSec.nextElementSibling === s.sec : groups.firstElementChild === s.sec;
      if (!secInPlace) prevSec ? prevSec.after(s.sec) : groups.prepend(s.sec);
      prevSec = s.sec;

      let prev = null;
      for (const o of items) {
        let li = shown.get(o.id);
        if (!li) {
          li = document.createElement("li");
          li.textContent = o.text;
          shown.set(o.id, li);
          if (loaded) {
            arrive(li);
            added = li;
          }
        } else if (li.textContent !== o.text) {
          li.textContent = o.text;
        }
        const inPlace = prev ? prev.nextElementSibling === li : s.ol.firstElementChild === li;
        if (!inPlace) prev ? prev.after(li) : s.ol.prepend(li);
        prev = li;
      }
    }

    // If you were already at the bottom, glide down to what just arrived.
    if (added && follow) added.scrollIntoView({ behavior: still.matches ? "auto" : "smooth", block: "end" });
    empty.hidden = objects.length > 0;
    loaded = true;
  }

  refresh();
  setInterval(() => document.hidden || refresh(), 4000);
  document.addEventListener("visibilitychange", () => document.hidden || refresh());
</script>
</body>
</html>
