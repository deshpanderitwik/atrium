<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Today</title>
<style>
  /* The day's blocks in order. The one you're in is the first one not yet
     done, lit up; tapping a block done records the time, so each block shows
     what was planned beside what actually happened. Parked loops wait
     underneath with their first step. */
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/BricolageGrotesque_400Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #0e0d0c;
    --ink: #f2eee6;
    --soft: #a89f94;
    --faint: #56504a;
    --hot: #ff6a2b;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    padding-block: max(10vh, env(safe-area-inset-top)) 18vh;
    padding-inline: max(7vw, 20px);
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 18px;
  }
  ol { list-style: none; margin: 0 0 12vh; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 4.2em minmax(0, 1fr);
    column-gap: 14px;
    align-items: baseline;
    padding-block: 14px;
    cursor: pointer;
    user-select: none;
    transition: opacity 300ms ease, color 300ms ease;
  }
  .time { font-family: var(--mono); font-size: 14px; color: var(--faint); }
  .title {
    font-size: clamp(26px, 5.2vw, 52px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }
  .note { grid-column: 2; color: var(--soft); font-size: clamp(15px, 2vw, 19px); line-height: 1.4; margin-top: 6px; }
  .actual { grid-column: 2; font-family: var(--mono); font-size: 13px; color: var(--soft); margin-top: 8px; }
  li.now .actual { color: var(--hot); }
  li.now .title { color: var(--hot); }
  li.now .time { color: var(--hot); }
  li.done { opacity: 0.4; }
  li.done .title { text-decoration: line-through; text-decoration-thickness: 1px; }
  #loops li { grid-template-columns: minmax(0, 1fr); }
  #loops .title { font-size: clamp(22px, 3.6vw, 36px); }
  #loops .note { grid-column: 1; }
  li:focus-visible { outline: 1px solid var(--soft); outline-offset: 6px; }
</style>
</head>
<body>
<p class="label" id="date">Today</p>
<ol id="blocks"></ol>
<p class="label" id="parked-label" hidden>Parked</p>
<ol id="loops"></ol>
<script>
  const blocksEl = document.getElementById("blocks");
  const loopsEl = document.getElementById("loops");
  let data = null;

  const minutes = (t) => {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  };

  // The block you're in is the first one you haven't finished, whatever the
  // clock says; the planned times stay as the intention.
  function currentId(blocks) {
    const b = blocks.find((b) => !b.done);
    return b ? b.id : null;
  }

  const hhmm = (ms) => {
    const d = new Date(ms);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const plannedMs = (t) => {
    const d = new Date(data.date + "T00:00:00");
    return d.getTime() + minutes(t) * 60000;
  };

  // A block starts when the one before it was tapped done.
  function actualLine(b, i, isNow) {
    const prev = data.blocks[i - 1];
    const start = prev && prev.done && prev.doneAt ? prev.doneAt : null;
    if (b.done && b.doneAt) {
      if (!start) return `done ${hhmm(b.doneAt)}`;
      const mins = Math.max(0, Math.round((b.doneAt - start) / 60000));
      return `actual ${hhmm(start)}–${hhmm(b.doneAt)} · ${mins} min`;
    }
    if (isNow && start && b.time) {
      const drift = Math.round((start - plannedMs(b.time)) / 60000);
      const when = Math.abs(drift) < 3 ? "on plan" : drift > 0 ? `${drift} min after plan` : `${-drift} min ahead of plan`;
      return `started ${hhmm(start)} · ${when}`;
    }
    return null;
  }

  function row(item, withTime) {
    const li = document.createElement("li");
    li.tabIndex = 0;
    li.dataset.id = item.id;
    if (withTime) {
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = item.time || "";
      li.append(t);
    }
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = item.title;
    li.append(title);
    if (item.note) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = item.note;
      li.append(n);
    }
    li.classList.toggle("done", !!item.done);
    const flip = () => toggle(item);
    li.addEventListener("click", flip);
    li.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), flip()));
    return li;
  }

  function render() {
    const nowId = currentId(data.blocks);
    blocksEl.replaceChildren(...data.blocks.map((b, i) => {
      const li = row(b, true);
      const isNow = b.id === nowId;
      li.classList.toggle("now", isNow);
      const line = actualLine(b, i, isNow);
      if (line) {
        const a = document.createElement("span");
        a.className = "actual";
        a.textContent = line;
        li.append(a);
      }
      return li;
    }));
    loopsEl.replaceChildren(...data.loops.map((l) => row(l, false)));
    document.getElementById("parked-label").hidden = data.loops.length === 0;
    const d = new Date(data.date + "T12:00:00");
    document.getElementById("date").textContent =
      "Today · " + d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  async function toggle(item) {
    item.done = item.done ? 0 : 1; // show it at once; the server has the real time
    item.doneAt = item.done ? Date.now() : null;
    render();
    try {
      const r = await fetch(`/api/plan/${item.id}/toggle`, { method: "POST" });
      if (!r.ok) throw new Error();
    } catch {
      item.done = item.done ? 0 : 1;
      item.doneAt = null;
      render();
      return;
    }
    last = null;
    refresh();
  }

  let last = null;
  async function refresh() {
    try {
      const body = await (await fetch("/api/today", { cache: "no-store" })).text();
      if (body === last && data) return render(); // keeps "now" moving with the clock
      last = body;
      data = JSON.parse(body);
      render();
    } catch {
      // server restarting; try again shortly
    }
  }

  refresh();
  setInterval(() => document.hidden || refresh(), 30000);
  document.addEventListener("visibilitychange", () => document.hidden || refresh());
</script>
</body>
</html>
