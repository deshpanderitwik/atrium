name: OTA Update

# The phone edit loop: every push of JS/asset changes publishes an EAS Update to
# the `production` channel. The TestFlight build picks it up on next launch/resume.
# Native changes (new deps, SDK bump) do NOT ship this way — they need a new
# build (see build.yml) plus a `version` bump in app.config.ts, since the
# runtimeVersion is keyed to the app version.
on:
  push:
    branches:
      - claude/testflight-ota-setup-jvwqy1
      - main
    paths-ignore:
      - "archive/**"
      - "process/**"
      - "**/*.md"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The commit message goes through an env var, never spliced into the
      # script, so quotes or newlines in it can't break (or inject into) the
      # command. Only its first line becomes the update message.
      - name: Publish OTA update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --branch production --message "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" --non-interactive
