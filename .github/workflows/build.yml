name: Build & Submit (TestFlight)

# Cuts a fresh native binary and submits it to TestFlight. Run this when native
# code changes (new native dependency, Expo SDK bump, icon/permissions) — the
# things OTA updates cannot carry. Trigger it manually, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
